<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Liste des utilisateurs</title>
	<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172033;
			background: #eef3f8;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			padding: 48px 20px;
			background: linear-gradient(135deg, #eef3f8 0%, #dce8f2 100%);
		}

		main {
			width: min(100%, 960px);
			margin: 0 auto;
		}

		.header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 24px;
			margin-bottom: 24px;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #167c80;
			font-size: 0.78rem;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2rem, 5vw, 3.4rem);
			line-height: 1;
			letter-spacing: -0.04em;
		}

		.subtitle {
			margin: 12px 0 0;
			color: #64748b;
			font-size: 1rem;
		}

		.badge {
			flex-shrink: 0;
			padding: 10px 14px;
			border: 1px solid #b9d8d8;
			border-radius: 999px;
			color: #116568;
			background: #e6f6f4;
			font-size: 0.85rem;
			font-weight: 700;
		}

		.table-wrap {
			overflow: hidden;
			border: 1px solid #d8e1e9;
			border-radius: 16px;
			background: #ffffff;
			box-shadow: 0 18px 45px rgba(33, 55, 76, 0.1);
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}

		th,
		td {
			padding: 18px 22px;
			border-bottom: 1px solid #e8eef3;
		}

		th {
			color: #64748b;
			background: #f8fafc;
			font-size: 0.75rem;
			font-weight: 800;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		td {
			font-size: 0.98rem;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		tbody tr {
			transition: background-color 160ms ease;
		}

		tbody tr:hover {
			background: #f1fbfa;
		}

		td:first-child {
			color: #167c80;
			font-weight: 800;
		}

		@media (max-width: 600px) {
			body {
				padding: 32px 12px;
			}

			.header {
				align-items: start;
				flex-direction: column;
				gap: 16px;
			}

			.table-wrap {
				overflow-x: auto;
			}

			table {
				min-width: 560px;
			}

			th,
			td {
				padding: 15px 16px;
			}
		}
	</style>
</head>
<body>
	<main>
		<header class="header">
			<div>
				<p class="eyebrow">Gestion des données</p>
				<h1>Utilisateurs</h1>
				<p class="subtitle">Consultez les informations enregistrées dans votre espace.</p>
			</div>
			<span class="badge">Annuaire actif</span>
		</header>

		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>Nom</th>
						<th>Âge</th>
						<th>Numéro</th>
					</tr>
				</thead>
				<tbody>
					{{range $id, $user := .}}
					<tr>
						<td>{{$id}}</td>
						<td>{{$user.Name}}</td>
						<td>{{$user.Age}}</td>
						<td>{{$user.Number}}</td>
					</tr>
					{{end}}
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
